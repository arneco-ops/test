# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

# =============================================================================
# UI5 Build Configuration für Cloud Foundry Deployment
# =============================================================================
# Diese Konfiguration wird für den Build-Prozess verwendet, der die Anwendung
# als ZIP-Archiv für das HTML5 Application Repository erstellt.
# Command: npm run build:cf
# =============================================================================

specVersion: "3.1"
metadata:
  name: angebotsliste
type: application

resources:
  configuration:
    propertiesFileSourceEncoding: UTF-8

builder:
  resources:
    # Ausschluss von Test-Dateien und Mock-Services aus dem Build
    excludes:
      - /test/**
      - /localService/**

  customTasks:
    # ui5-task-zipper: Erstellt ein ZIP-Archiv der Anwendung
    # Wird nach dem Cache-Buster-Schritt ausgeführt
    - name: ui5-task-zipper
      afterTask: generateCachebusterInfo
      configuration:
        archiveName: angebotsliste       # Name des ZIP-Archives
        # Zusätzliche Dateien, die zum ZIP hinzugefügt werden
        # HINWEIS: manifest.json wird automatisch aus webapp/ gepackt
        additionalFiles:
          - xs-app.json                  # App Router Konfiguration
