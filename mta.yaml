## ============================================================================
## SAP BTP HTML5 Application - Multi-Target Application Descriptor
## ============================================================================
## Diese Datei definiert die Struktur und Abhängigkeiten der Anwendung für
## das Deployment auf SAP Business Technology Platform (Cloud Foundry)
## Basiert auf SAP Best Practice für managed approuter Setup
## ============================================================================

_schema-version: "3.2"
ID: angebotsliste
version: 1.0.0
description: Angebotsliste HTML5 App with managed approuter

## ----------------------------------------------------------------------------
## MODULES - Deploybare Komponenten der Anwendung
## ----------------------------------------------------------------------------

modules:
  ## Destination Content Module
  ## KRITISCH: Erstellt Service-Keys und registriert Destinations
  ## Ohne dieses Modul wird die App nicht im Cockpit angezeigt!
  - name: angebotsliste-dest-content
    type: com.sap.application.content
    requires:
      - name: angebotsliste-destination-service
        parameters:
          content-target: true
      - name: angebotsliste-repo-host
        parameters:
          service-key:
            name: angebotsliste-repo-host-key
      - name: wm-angebotsliste-xsuaa
        parameters:
          service-key:
            name: angebotsliste-xsuaa-key
    parameters:
      content:
        instance:
          destinations:
            ## HTML5 Repo Host als Destination registrieren
            - Name: angebotsliste_repo_host
              ServiceInstanceName: angebotsliste-html5-app-host
              ServiceKeyName: angebotsliste-repo-host-key
              sap.cloud.service: angebotsliste
            ## XSUAA als Destination für OAuth2 registrieren
            - Authentication: OAuth2UserTokenExchange
              Name: angebotsliste_xsuaa
              ServiceInstanceName: wm-angebotsliste-xsuaa
              ServiceKeyName: angebotsliste-xsuaa-key
              sap.cloud.service: angebotsliste
          existing_destinations_policy: ignore
    build-parameters:
      no-source: true

  ## HTML5 Application Content Module
  ## Lädt die HTML5 App in den BTP HTML5 Application Repository Service hoch
  - name: angebotsliste-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: angebotsliste-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - name: angebotsliste
          artifacts:
            - angebotsliste.zip
          target-path: resources/

  ## HTML5 Application Module
  ## Enthält die UI5 Anwendung und wird als ZIP-Archiv gebaut
  - name: angebotsliste
    type: html5
    path: .
    build-parameters:
      builder: custom
      commands:
        - npm ci
        - npm run build:cf              # Erstellt dist/ mit angebotsliste.zip
      supported-platforms: []
      build-result: dist                # Gesamtes dist/ Verzeichnis
      ignore:
        - node_modules/
        - test/
        - test-resources/
        - .git/
        - .gitignore
        - package-lock.json

## ----------------------------------------------------------------------------
## RESOURCES - BTP Service Instanzen
## ----------------------------------------------------------------------------

resources:
  ## Destination Service
  ## Verwaltet Verbindungen zu Backend-Systemen
  - name: angebotsliste-destination-service
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-name: angebotsliste-destination-service
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            destinations:
              - Name: ui5
                Type: HTTP
                URL: https://ui5.sap.com
                ProxyType: Internet
                Authentication: NoAuthentication
            existing_destinations_policy: ignore
        version: 1.0.0

  ## XSUAA Service - Authentication & Authorization
  ## Verwaltet Benutzer-Authentifizierung und Berechtigungen
  - name: wm-angebotsliste-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-name: wm-angebotsliste-xsuaa
      service-plan: application
      path: ./xs-security.json

  ## HTML5 Application Repository - Host Service
  ## Speichert die HTML5 Application Files
  - name: angebotsliste-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-name: angebotsliste-html5-app-host
      service-plan: app-host

## ----------------------------------------------------------------------------
## PARAMETERS - Globale Deployment-Einstellungen
## ----------------------------------------------------------------------------

parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
