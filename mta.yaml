_schema-version: "3.2"
ID: angebotsliste
version: 1.0.0
modules:
- name: angebotsliste
  type: html5
  path: .
  build-parameters:
    builder: custom
    commands:
    - npm ci
    - npm run build
    supported-platforms: []
    build-result: dist
- name: angebotsliste-deployer
  type: com.sap.application.content
  path: .
  requires:
  - name: angebotsliste-repo-host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - dist
      name: angebotsliste
      target-path: resources/angebotsliste
resources:
- name: wm-angebotsliste-xsuaa
  type: org.cloudfoundry.managed-service
  parameters:
    path: ./xs-security.json
    service: xsuaa
    service-plan: application
- name: wm-angebotsliste-html5-repo
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-plan: app-runtime
- name: angebotsliste-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: angebotsliste-html5-service
    service-plan: app-host
- name: angebotsliste-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: false
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          existing_destinations_policy: update
      version: 1.0.0
    service: destination
    service-name: angebotsliste-destination-service
    service-plan: lite
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
