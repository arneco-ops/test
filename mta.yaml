_schema-version: "3.2"
ID: angebotsliste
version: 1.0.0

modules:
- name: angebotsliste
  type: html5
  path: .
  build-parameters:
    builder: custom
    commands:
    - npm ci
    - npm run build:cf
    - mkdir -p dist-zip
    - cp dist/angebotsliste.zip dist-zip/
    supported-platforms: []
    build-result: dist-zip

- name: angebotsliste-deployer
  type: com.sap.application.content
  path: .
  requires:
  - name: angebotsliste-repo-host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - name: angebotsliste
      artifacts:
      - angebotsliste.zip
      target-path: resources/

resources:
- name: angebotsliste-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: angebotsliste-html5-service
    service-plan: app-host

- name: wm-angebotsliste-xsuaa
  type: org.cloudfoundry.managed-service
  parameters:
    path: ./xs-security.json
    service: xsuaa
    service-plan: application

- name: angebotsliste-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    service: destination
    service-name: angebotsliste-destination-service
    service-plan: lite
    config:
      HTML5Runtime_enabled: true
      init_data:
        instance:
          destinations:
          - Name: ui5
            Type: HTTP
            URL: https://ui5.sap.com
            ProxyType: Internet
            Authentication: NoAuthentication
          existing_destinations_policy: update

parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true